name: 每日赛事监控

on:
  schedule:
    - cron: '30 1 * * *'   # 每天 UTC 01:30 → 北京时间 09:30
  workflow_dispatch:        # 手动触发

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 恢复 events.json 缓存
        uses: actions/cache@v3
        with:
          path: events.json
          key: events-cache

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行监控
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
        run: python monitor.py

      - name: 保存 events.json 缓存
        uses: actions/cache@v3
        with:
          path: events.json
          key: events-cache
